name: CI

on:
  push:
    branches:
      - main
  # serg/tasks#1692: pull_request убран намеренно. job ниже идёт на self-hosted
  # раннере (docker --gpus, sudo), а репозиторий публичный: PR из форка не должен
  # исполнять код на машине меша. Ручной запуск — только из main.
  workflow_dispatch:

jobs:
  test-linux-gpu:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    strategy:
      fail-fast: false
      # matrix:
      #   python-version: ["3.9"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install black

      - name: Black Format Check
        run: black --check .

      - name: Run Tests
        run: |
          docker run -u ci:ci --gpus all --rm -v ${{ github.workspace }}:/app cuda11_py11:latest \
          bash -c "cd /app && \
          sudo bash ./.github/workflows/setup_env.sh && \
          pip install -e . && \
          python -m unittest discover tests"

      - name: Display Speed Test
        run: cat speed_test.txt


      - name: Upload Test Results as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: speed-test-results
          path: speed_test.txt
